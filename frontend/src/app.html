<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#121212" />
		<script>
			try {
				// Compiled theme cache; see client/appearance.svelte.ts.
				var look = JSON.parse(localStorage.getItem('prism:appearance') || 'null');
				var light = look
					? look.scheme === 'light'
					: localStorage.getItem('prism:theme') === 'light';
				if (light) document.documentElement.dataset.theme = 'light';
				if (look && look.css) {
					var style = document.createElement('style');
					style.id = 'prism-theme';
					style.textContent = look.css;
					document.head.appendChild(style);
				}
				var color = look ? look.themeColor : light && '#f7f5ef';
				if (color) document.querySelector('meta[name="theme-color"]').content = color;
				if (localStorage.getItem('prism:corners') === 'square')
					document.documentElement.dataset.corners = 'square';
				if (localStorage.getItem('prism:list') === 'minimal')
					document.documentElement.dataset.list = 'minimal';
				if (localStorage.getItem('prism:toolbar') === 'hidden')
					document.documentElement.dataset.toolbar = 'hidden';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#121212" />
		<script>
			try {
				if (localStorage.getItem('prism:theme') === 'light') {
					document.documentElement.dataset.theme = 'light';
					document.querySelector('meta[name="theme-color"]').content = '#f7f5ef';
				}
				if (localStorage.getItem('prism:corners') === 'square')
					document.documentElement.dataset.corners = 'square';
				if (localStorage.getItem('prism:list') === 'minimal')
					document.documentElement.dataset.list = 'minimal';
				if (localStorage.getItem('prism:toolbar') === 'hidden')
					document.documentElement.dataset.toolbar = 'hidden';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

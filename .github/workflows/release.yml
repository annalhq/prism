name: Release

# On every version tag (`bun run release` then `git push --follow-tags`): rebuild the Firefox and
# Chrome extensions, write release notes from the Conventional Commits since the previous tag, and
# publish the GitHub Release with the packages attached. Replaces the "Unreleased" draft kept by
# the Release Drafter workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the release notes

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Type-check extensions
        run: |
          bun run --cwd extensions/firefox check
          bun run --cwd extensions/chrome check

      - name: Build and package extensions
        run: bun run zip:extensions

      # Optional: runs only when the AMO API keys are set as repository secrets.
      - name: Sign Firefox build (unlisted)
        if: env.WEB_EXT_API_KEY != ''
        run: >
          bunx web-ext sign
          --source-dir extensions/firefox/.output/firefox-mv3
          --artifacts-dir extensions/firefox/.output/signed
          --channel unlisted

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prism-extensions
          path: |
            extensions/firefox/.output/*-firefox.xpi
            extensions/firefox/.output/signed/*.xpi
            extensions/chrome/.output/*-chrome.zip
          if-no-files-found: error

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bun scripts/release-notes.ts --to "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || echo "Maintenance release." > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the Unreleased draft
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release delete unreleased --yes || true

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            extensions/firefox/.output/*-firefox.xpi
            extensions/firefox/.output/signed/*.xpi
            extensions/chrome/.output/*-chrome.zip
          fail_on_unmatched_files: false

name: Release

# On every version tag (`bun run release` then `git push --follow-tags`): rebuild the Firefox and
# Chrome extensions and publish the GitHub Release with the packages attached. The release notes
# are this version's section of CHANGELOG.md, which commit-and-tag-version wrote from the
# Conventional Commits since the previous tag. Replaces the "Unreleased" draft kept by
# the Release Drafter workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the release notes

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Type-check extensions
        run: |
          bun run --cwd extensions/firefox check
          bun run --cwd extensions/chrome check

      - name: Build and package extensions
        run: bun run zip:extensions

      # Optional: runs only when the AMO API keys are set as repository secrets.
      - name: Sign Firefox build (unlisted)
        if: env.WEB_EXT_API_KEY != ''
        run: >
          bunx web-ext sign
          --source-dir extensions/firefox/.output/firefox-mv3
          --artifacts-dir extensions/firefox/.output/signed
          --channel unlisted

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prism-extensions
          path: |
            extensions/firefox/.output/*-firefox.xpi
            extensions/firefox/.output/signed/*.xpi
            extensions/chrome/.output/*-chrome.zip
          if-no-files-found: error
          # WXT writes packages under .output, a hidden directory, which upload-artifact v4.4+
          # skips unless told otherwise.
          include-hidden-files: true

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's section: from its "## [x.y.z]" (or "## x.y.z") heading to the next one,
          # without the heading itself since the release title already names the version.
          awk -v v="$version" '
            /^##? \[?[0-9]/ { if (found) exit; if (index($0, "[" v "]") || index($0, "# " v " ")) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || echo "Maintenance release." > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the Unreleased draft
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release delete unreleased --yes || true

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            extensions/firefox/.output/*-firefox.xpi
            extensions/firefox/.output/signed/*.xpi
            extensions/chrome/.output/*-chrome.zip
          fail_on_unmatched_files: false

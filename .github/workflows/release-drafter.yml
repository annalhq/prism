name: Release Drafter

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-drafter
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # The same changelog `bun run release` will write, previewed without touching any file.
      - name: Write draft notes
        run: |
          bunx commit-and-tag-version --dry-run \
            | awk '/^---$/ { n++; next } n == 1' | tail -n +2 > notes.md
          grep -q '^### ' notes.md || : > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the Unreleased draft
        run: |
          # Draft releases can't be looked up by an existing tag, so replace the draft each time.
          gh release delete unreleased --yes || true
          if [ -s notes.md ]; then
            gh release create unreleased --draft --target "$GITHUB_SHA" \
              --title "Unreleased" --notes-file notes.md
          fi
